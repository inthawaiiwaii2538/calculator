<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบิลหวย (รองรับเลขหาง)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .bill-card { background: white; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 24px; overflow: hidden; border: 1px solid #e2e8f0; }
        .bill-header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white; padding: 16px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Input Area -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4 italic">📋 วางรายการบิล</h1>
            <textarea id="inputText" class="w-full h-48 p-4 border-2 border-slate-100 rounded-xl focus:border-blue-500 focus:ring-0 outline-none font-mono text-sm mb-4 bg-slate-50" 
                placeholder="ตัวอย่าง:&#10;บิล1 ลาว&#10;311-122=15x3หาง&#10;785=2&#10;280=1x5&#10;£"></textarea>
            <div class="flex gap-3">
                <button onclick="processInput()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
                    ประมวลผลข้อมูล
                </button>
                <button onclick="clearData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 px-8 rounded-xl transition-all">
                    ล้างจอ
                </button>
            </div>
        </div>

        <!-- Result Area -->
        <div id="displayArea"></div>
    </div>

    <script>
        let bills = [];
        const LIMITS = { '3DIRECT': 15, '3TOAD': 50, '2DIGITS': 30 };

        function processInput() {
            const text = document.getElementById('inputText').value;
            if (!text.trim()) return;

            const sections = text.split(/บิล\s*(\d+)/).filter(s => s.trim() !== "");
            
            for (let i = 0; i < sections.length; i += 2) {
                let bId = sections[i].match(/^\d+$/) ? sections[i] : (bills.length + 1);
                let content = sections[i+1] || sections[i];
                let currency = content.includes('€') ? '€' : '£';
                let items = [];

                const lines = content.split('\n');
                lines.forEach(line => {
                    // 1. เช็คแบบ "หาง" (เช่น 311-122=15x3หาง)
                    const hangMatch = line.match(/([\d\-\s]+)\s*=\s*([\d.]+)\s*x\s*(\d+)\s*หาง/);
                    // 2. เช็คแบบ "ตรงโต๊ด" (เช่น 280=1x5)
                    const toadMatch = line.match(/(\d+)\s*=\s*([\d.]+)\s*[xX*]\s*([\d.]+)/);
                    // 3. เช็คแบบ "ปกติ" (เช่น 785=2)
                    const normalMatch = line.match(/(\d+)\s*=\s*([\d.]+)/);

                    if (hangMatch) {
                        const nums = hangMatch[1].split(/[-,\s]+/).filter(n => n.length > 0);
                        const price = parseFloat(hangMatch[2]);
                        const hangCount = parseInt(hangMatch[3]);
                        nums.forEach(n => {
                            for(let k=0; k<hangCount; k++) {
                                items.push(createItem(n, price, '3DIRECT', currency, `หางที่ ${k+1}`));
                            }
                        });
                    } else if (toadMatch) {
                        const n = toadMatch[1];
                        items.push(createItem(n, parseFloat(toadMatch[2]), '3DIRECT', currency));
                        items.push(createItem(n, parseFloat(toadMatch[3]), '3TOAD', currency));
                    } else if (normalMatch) {
                        const n = normalMatch[1];
                        let type = n.length === 3 ? '3DIRECT' : '2DIGITS';
                        items.push(createItem(n, parseFloat(normalMatch[2]), type, currency));
                    }
                });

                if (items.length > 0) {
                    bills.push({ id: bId, currency, items });
                }
            }
            render();
            document.getElementById('inputText').value = '';
        }

        function createItem(num, amount, type, curr, note = "") {
            let limit = LIMITS[type] || 30;
            let amountGBP = curr === '€' ? amount / 1.5 : amount;
            
            let inLimitGBP = Math.min(amountGBP, limit);
            let overLimitGBP = Math.max(0, amountGBP - limit);

            return {
                id: Math.random().toString(36).substr(2, 9),
                num: num,
                type: type === '3DIRECT' ? '3ตรง' : (type === '3TOAD' ? '3โต๊ด' : '2ตัว'),
                note: note,
                total: amount,
                amt28: curr === '€' ? inLimitGBP * 1.5 : inLimitGBP,
                amt22: curr === '€' ? overLimitGBP * 1.5 : overLimitGBP
            };
        }

        function deleteRow(billIdx, itemId) {
            bills[billIdx].items = bills[billIdx].items.filter(it => it.id !== itemId);
            if (bills[billIdx].items.length === 0) bills.splice(billIdx, 1);
            render();
        }

        function clearData() { if(confirm('ล้างข้อมูลทั้งหมด?')) { bills = []; render(); } }

        function render() {
            const area = document.getElementById('displayArea');
            area.innerHTML = '';

            bills.forEach((bill, bIdx) => {
                let s28 = bill.items.reduce((a, b) => a + b.amt28, 0);
                let s22 = bill.items.reduce((a, b) => a + b.amt22, 0);

                let rows = bill.items.map(it => `
                    <tr class="border-b text-sm hover:bg-slate-50 transition-colors">
                        <td class="py-3 px-4 text-gray-600">${it.type} <span class="text-[10px] text-blue-500">${it.note}</span></td>
                        <td class="py-3 px-4 text-center font-bold text-slate-800">${it.num}</td>
                        <td class="py-3 px-4 text-center">${it.total.toFixed(2)} ${bill.currency}</td>
                        <td class="py-3 px-4 text-center text-blue-600 font-semibold">${it.amt28.toFixed(2)} ${bill.currency}</td>
                        <td class="py-3 px-4 text-center text-red-500 font-semibold">${it.amt22.toFixed(2)} ${bill.currency}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteRow(${bIdx}, '${it.id}')" class="text-slate-300 hover:text-red-500 transition-colors">❌</button>
                        </td>
                    </tr>
                `).join('');

                area.innerHTML += `
                    <div class="bill-card animate-in slide-in-from-bottom-4 duration-300">
                        <div class="bill-header flex justify-between items-center">
                            <span class="font-bold text-lg">📄 บิลที่ ${bill.id}</span>
                            <div class="flex gap-4">
                                <span class="bg-white/20 px-3 py-1 rounded-full text-xs">28%: ${s28.toFixed(2)}${bill.currency}</span>
                                <span class="bg-red-500/30 px-3 py-1 rounded-full text-xs">22%: ${s22.toFixed(2)}${bill.currency}</span>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase font-bold">
                                    <tr>
                                        <th class="py-3 px-4">รายการ</th>
                                        <th class="py-3 px-4 text-center">เลข</th>
                                        <th class="py-3 px-4 text-center">ยอดรวม</th>
                                        <th class="py-3 px-4 text-center">28%</th>
                                        <th class="py-3 px-4 text-center">22%</th>
                                        <th class="py-3 px-4 text-center">ลบ</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
