<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณบิลหวย (V.3)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; background-color: #f0f4f8; }</style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-3xl shadow-xl border-t-8 border-blue-600 mb-6">
            <h1 class="text-xl font-bold text-gray-800 mb-4">📝 วางบิลหวย (รองรับหลายบิล)</h1>
            <textarea id="inputData" class="w-full h-80 p-4 border-2 border-gray-100 rounded-2xl focus:border-blue-400 outline-none font-mono text-sm mb-4" 
            placeholder="บิล1 ลาว...&#10;280=1×5&#10;£&#10;&#10;บิล2 ลาว...&#10;280=5&#10;€"></textarea>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="calculate()" class="bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg transition-all">
                    คำนวณบิลทั้งหมด
                </button>
                <button onclick="clearData()" class="bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl hover:bg-gray-200 transition-all">
                    ล้างข้อมูล
                </button>
            </div>
        </div>

        <div class="bg-blue-600 text-white rounded-t-2xl px-6 py-3 flex justify-between font-bold text-sm shadow-lg">
            <div class="w-16 text-center">บิล</div>
            <div class="w-16 text-center">เงิน</div>
            <div class="flex-1 text-center">28%</div>
            <div class="flex-1 text-center">22%</div>
        </div>
        <div id="resultBody" class="bg-white rounded-b-2xl shadow-xl overflow-hidden mb-10">
            <!-- ผลลัพธ์จะแสดงที่นี่ -->
            <div class="p-10 text-center text-gray-400">ยังไม่มีข้อมูล... กรุณาวางบิลแล้วกดคำนวณ</div>
        </div>
    </div>

    <script>
        const LIMITS = { '2D': 30, '3D': 15, '3T': 50, '4D': 15 };

        function calculate() {
            const rawText = document.getElementById('inputData').value;
            const resultBody = document.getElementById('resultBody');
            
            if (!rawText.trim()) {
                alert("กรุณาใส่ข้อมูลบิล");
                return;
            }

            resultBody.innerHTML = '';
            const globalAccumulator = {}; // เก็บยอดสะสมของเลขแต่ละตัว

            // วิธีแยกบิลใหม่: แยกตามคำว่า "บิล" หรือ "บรรทัดใหม่ที่ขึ้นต้นด้วยเลข"
            const rawBlocks = rawText.split(/\n(?=บิล|\d+)/g);
            
            let billCount = 0;

            rawBlocks.forEach((block) => {
                if (!block.trim()) return;

                let currency = block.includes('€') ? '€' : '£';
                let bill28 = 0;
                let bill22 = 0;
                let hasData = false;

                const lines = block.split('\n');
                lines.forEach(line => {
                    // ตรวจจับตัวเลขหวย num=price
                    const match = line.match(/([\d-]+)\s*=\s*([\d.xX*×]+)/);
                    if (match) {
                        hasData = true;
                        let numPart = match[1];
                        let pricePart = match[2];
                        let numbers = numPart.includes('-') ? numPart.split('-') : [numPart];

                        // แยกยอดเงิน รองรับ x, X, *, ×
                        let priceSubItems = pricePart.split(/[xX*×]/).filter(s => s !== "").map(Number);
                        
                        numbers.forEach(num => {
                            priceSubItems.forEach((amt, pIndex) => {
                                let type = "2D";
                                if (num.length === 3) {
                                    if (pIndex === 1 || line.includes("โต๊ด")) type = "3T";
                                    else type = "3D";
                                } else if (num.length === 4) {
                                    type = "4D";
                                }

                                let key = `${type}-${num}`;
                                let amtGBP = currency === '€' ? amt / 1.5 : amt;

                                let alreadyUsed = globalAccumulator[key] || 0;
                                let limit = LIMITS[type] || 30;

                                let canFit = Math.max(0, limit - alreadyUsed);
                                let portion28 = Math.min(amtGBP, canFit);
                                let portion22 = Math.max(0, amtGBP - canFit);

                                // บวกยอดกลับเป็นสกุลเงินเดิมของบิลนั้น
                                bill28 += (currency === '€' ? portion28 * 1.5 : portion28);
                                bill22 += (currency === '€' ? portion22 * 1.5 : portion22);

                                globalAccumulator[key] = alreadyUsed + amtGBP;
                            });
                        });
                    }
                });

                if (hasData) {
                    billCount++;
                    addResultRow(billCount, currency, bill28, bill22);
                }
            });

            if (billCount === 0) {
                resultBody.innerHTML = '<div class="p-10 text-center text-red-500">ตรวจไม่พบตัวเลขในรูปแบบ 123=50 <br>กรุณาตรวจสอบว่ามีเครื่องหมาย = หรือไม่</div>';
            }
        }

        function addResultRow(id, curr, val28, val22) {
            const resultBody = document.getElementById('resultBody');
            const row = document.createElement('div');
            row.className = "flex justify-between items-center px-6 py-4 border-b border-gray-50 hover:bg-blue-50 transition-all";
            row.innerHTML = `
                <div class="w-16 text-center font-bold text-gray-500">${id}</div>
                <div class="w-16 text-center font-bold ${curr === '€' ? 'text-blue-600' : 'text-green-600'}">${curr}</div>
                <div class="flex-1 text-center font-semibold text-gray-800 text-lg">${formatNum(val28)}</div>
                <div class="flex-1 text-center font-semibold text-red-500 text-lg">${formatNum(val22)}</div>
            `;
            resultBody.appendChild(row);
        }

        function formatNum(n) {
            return n === 0 ? "0" : Number(n.toFixed(2)).toString();
        }

        function clearData() {
            document.getElementById('inputData').value = '';
            document.getElementById('resultBody').innerHTML = '<div class="p-10 text-center text-gray-400">ยังไม่มีข้อมูล... กรุณาวางบิลแล้วกดคำนวณ</div>';
        }
    </script>
</body>
</html>
