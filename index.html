<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการบิลหวย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        .bill-header { background-color: #2d3e50; color: white; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <!-- ส่วนกรอกข้อมูล -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">คัดลอกและวางบิลที่นี่</h2>
            <textarea id="inputText" class="w-full h-48 p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm" placeholder="บิล1 ลาว&#10;785=2&#10;280=1x5&#10;£"></textarea>
            <button onclick="processBills()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all">
                ประมวลผลข้อมูล
            </button>
        </div>

        <!-- ส่วนแสดงผลบิล -->
        <div id="billContainer" class="space-y-6">
            <!-- บิลแต่ละอันจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <script>
        // ตั้งค่าตัวแปร
        const LIMITS_GBP = { '3DIRECT': 15, '3TOAD': 50, '2DIGITS': 30, '4DIRECT': 15 };

        function processBills() {
            const text = document.getElementById('inputText').value;
            const container = document.getElementById('billContainer');
            container.innerHTML = '';

            // แยกบิลด้วยคำว่า "บิล"
            const billBlocks = text.split(/บิล\s*\d+/).filter(b => b.trim() !== "");
            
            billBlocks.forEach((block, index) => {
                const currency = block.includes('€') ? '€' : '£';
                const lines = block.split('\n');
                let billItems = [];
                let totalSum28 = 0;
                let totalSum22 = 0;

                lines.forEach(line => {
                    const match = line.match(/(\d+)\s*=\s*([\d.xX*]+)/);
                    if (match) {
                        const num = match[1];
                        const val = match[2];

                        if (val.includes('x') || val.includes('*')) {
                            const [d, t] = val.split(/[x*]/).map(Number);
                            billItems.push(calculateSplit(num, d, '3DIRECT', currency));
                            billItems.push(calculateSplit(num, t, '3TOAD', currency));
                        } else {
                            let type = num.length === 3 ? '3DIRECT' : (num.length === 2 ? '2DIGITS' : '4DIRECT');
                            billItems.push(calculateSplit(num, parseFloat(val), type, currency));
                        }
                    }
                });

                if (billItems.length > 0) {
                    totalSum28 = billItems.reduce((s, i) => s + i.amt28, 0);
                    totalSum22 = billItems.reduce((s, i) => s + i.amt22, 0);
                    renderBill(index + 1, billItems, totalSum28, totalSum22, currency);
                }
            });
        }

        function calculateSplit(num, amount, type, curr) {
            let limitGBP = LIMITS_GBP[type];
            let amountGBP = curr === '€' ? amount / 1.5 : amount;
            
            let withinLimitGBP = Math.min(amountGBP, limitGBP);
            let excessGBP = Math.max(0, amountGBP - limitGBP);

            // แปลงกลับเป็นสกุลเงินต้นทางเพื่อแสดงผล
            let amt28 = curr === '€' ? withinLimitGBP * 1.5 : withinLimitGBP;
            let amt22 = curr === '€' ? excessGBP * 1.5 : excessGBP;

            let typeThai = "";
            if(type === '3DIRECT') typeThai = "3ตรง บน";
            else if(type === '3TOAD') typeThai = "3โต๊ด";
            else if(type === '2DIGITS') typeThai = "2ตัว บน-ล่าง";
            else typeThai = "4ตรง";

            return {
                type: typeThai,
                num: num,
                total: amount,
                amt28: amt28,
                amt22: amt22
            };
        }

        function renderBill(id, items, sum28, sum22, curr) {
            const container = document.getElementById('billContainer');
            let rows = items.map(item => `
                <tr class="border-b text-center text-sm md:text-base">
                    <td class="py-4 text-left pl-4">
                        <span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded">หวยลาว</span><br>
                        <span class="text-gray-600">${item.type}</span>
                    </td>
                    <td class="font-bold text-lg">${item.num}</td>
                    <td>${item.total.toFixed(2)} ${curr}</td>
                    <td class="text-blue-600 font-semibold">${item.amt28.toFixed(2)} ${curr}</td>
                    <td class="text-red-500 font-semibold">${item.amt22.toFixed(2)} ${curr}</td>
                    <td><button class="text-red-400 hover:text-red-600 text-xl">❌</button></td>
                </tr>
            `).join('');

            const billHtml = `
                <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                    <div class="bill-header p-4 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">📄</span>
                            <span class="text-xl font-bold">บิลที่ ${id}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-gray-300">28%: </span><span class="font-bold">${sum28.toFixed(2)}${curr}</span>
                            <span class="mx-2">|</span>
                            <span class="text-red-400">22%: </span><span class="font-bold text-red-400">${sum22.toFixed(2)}${curr}</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-sm border-b">
                                    <th class="py-3 pl-4 text-left">รายการ</th>
                                    <th>เลข</th>
                                    <th>ยอดรวม</th>
                                    <th>28%</th>
                                    <th>22%</th>
                                    <th>ลบ</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML += billHtml;
        }
    </script>
</body>
</html>
